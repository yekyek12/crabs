services:
  - type: web
    name: crabs
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: Crab Recognition AI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: debug
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: crabs-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: crabs-postgres
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: crabs-postgres
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: crabs-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: crabs-postgres
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "43200"
      - key: SESSION_EXPIRE_ON_CLOSE
        value: "false"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FORCE_DEFAULT_SEEDER
        value: "false"
      - key: FILESYSTEM_DISK
        value: local
      # Local storage on Render free web services is still ephemeral.
      # Use managed Postgres for rows, and object storage or a paid disk for uploaded files.
      - key: LOCAL_FILESYSTEM_ROOT
        value: /var/www/html/persist/storage/app/private
      - key: PUBLIC_FILESYSTEM_ROOT
        value: /var/www/html/persist/storage/app/public
      - key: AI_SERVICE_URL
        value: https://crabs-ai-service.onrender.com
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: crabs-ai-service
          envVarKey: AI_SERVICE_TOKEN
      - key: AI_REQUEST_TIMEOUT
        value: "60"
      - key: AI_HEALTH_TIMEOUT
        value: "12"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: AI_HIGH_CONFIDENCE_THRESHOLD
        value: "0.85"
      - key: LOCATION_MAX_DEVICE_ACCURACY_METERS
        value: "100"
      - key: AI_CONSENSUS_ENABLED
        value: "true"
      - key: AI_REQUIRED_PROVIDER_COUNT
        value: "6"
      - key: AI_MIN_PROVIDER_AGREEMENT
        value: "4"
      - key: AI_ALLOW_SINGLE_PROVIDER_RESULT
        value: "false"
      - key: AI_GLOBAL_DETECTION
        value: "true"
      - key: AI_PROVIDER_ORDER
        value: gemini,anthropic,groq,openrouter,cohere,wisdomgate
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: WISDOMGATE_API_KEY
        sync: false

  - type: web
    name: crabs-ai-service
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: ai-service
    buildCommand: 'python --version && pip install --upgrade pip setuptools wheel && pip install --only-binary=:all: -r requirements.txt'
    startCommand: 'uvicorn main:app --host 0.0.0.0 --port $PORT'
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AI_SERVICE_TOKEN
        generateValue: true
      - key: AI_MODEL_NAME
        value: YOLO Crab Recognition Adapter
      - key: AI_MODEL_VERSION
        value: placeholder-1.0.0
      - key: AI_MODEL_CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: AI_MODEL_CLASSES
        value: ""
      - key: AI_MODEL_PATH
        value: ""

databases:
  - name: crabs-postgres
    databaseName: crabs
    user: crabs
    # Free Postgres data persists across normal deploys, but the database expires after 30 days.
    # Upgrade this plan before storing production data long term.
    plan: free
    region: singapore
    postgresMajorVersion: "18"
