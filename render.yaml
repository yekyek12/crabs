services:
  - type: web
    name: crabs
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /
    disk:
      name: crabs-persistent-data
      mountPath: /var/www/html/persist
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: Crab Recognition AI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: debug
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          type: pserv
          name: crabs-mysql
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        fromService:
          type: pserv
          name: crabs-mysql
          envVarKey: MYSQL_DATABASE
      - key: DB_USERNAME
        fromService:
          type: pserv
          name: crabs-mysql
          envVarKey: MYSQL_USER
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: crabs-mysql
          envVarKey: MYSQL_PASSWORD
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "43200"
      - key: SESSION_EXPIRE_ON_CLOSE
        value: "false"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: LOCAL_FILESYSTEM_ROOT
        value: /var/www/html/persist/storage/app/private
      - key: PUBLIC_FILESYSTEM_ROOT
        value: /var/www/html/persist/storage/app/public
      - key: AI_SERVICE_URL
        fromService:
          type: pserv
          name: crabs-ai-service
          property: hostport
      - key: AI_SERVICE_TOKEN
        fromService:
          type: pserv
          name: crabs-ai-service
          envVarKey: AI_SERVICE_TOKEN
      - key: AI_REQUEST_TIMEOUT
        value: "60"
      - key: AI_HEALTH_TIMEOUT
        value: "12"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: AI_HIGH_CONFIDENCE_THRESHOLD
        value: "0.85"
      - key: AI_CONSENSUS_ENABLED
        value: "true"
      - key: AI_MIN_PROVIDER_AGREEMENT
        value: "2"
      - key: AI_ALLOW_SINGLE_PROVIDER_RESULT
        value: "true"
      - key: AI_GLOBAL_DETECTION
        value: "true"
      - key: AI_PROVIDER_ORDER
        value: gemini,anthropic,groq,openrouter,cohere,wisdomgate,local
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: WISDOMGATE_API_KEY
        sync: false

  - type: pserv
    name: crabs-ai-service
    runtime: python
    plan: starter
    region: singapore
    branch: main
    rootDir: ai-service
    buildCommand: 'python --version && pip install --upgrade pip setuptools wheel && pip install --only-binary=:all: -r requirements.txt'
    startCommand: 'uvicorn main:app --host 0.0.0.0 --port $PORT'
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AI_SERVICE_TOKEN
        generateValue: true
      - key: AI_MODEL_NAME
        value: YOLO Crab Recognition Adapter
      - key: AI_MODEL_VERSION
        value: placeholder-1.0.0
      - key: AI_MODEL_CONFIDENCE_THRESHOLD
        value: "0.60"
      - key: AI_MODEL_CLASSES
        value: ""
      - key: AI_MODEL_PATH
        value: ""

  - type: pserv
    name: crabs-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.4
    plan: starter
    region: singapore
    disk:
      name: crabs-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: crabs
      - key: MYSQL_USER
        value: crabs
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
